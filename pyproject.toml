[project]
name = "python-hooks"
dynamic = ["version"]
description = "Custom Python pre-commit hooks for use by Tatari"
authors = [{ name = "Tatari SRE", email = "sre@tatari.tv" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "toml>=0.10.2",
]

[project.urls]
Repository = "https://github.com/tatari-tv/pre-commit-hooks"

[project.scripts]
forbidden-imports = "python_hooks.forbidden_imports:main"
disallowed-identifiers = "python_hooks.disallowed_identifiers:main"
do-not-support-generated-columns = "python_hooks.do_not_support_generated_columns:main"
validate-branch-name = "python_hooks.validate_branch_name:main"
image-tag-branch-constraint = "python_hooks.image_tag_branch_constraint:main"
no-non-spark-buckets-in-spark-projects = "python_hooks.no_non_spark_buckets_in_spark_projects:main"
no-boto3-in-airflow-dags = "python_hooks.no_boto3_in_airflow_dags:main"
no-hardcoded-buckets = "python_hooks.no_hardcoded_buckets:main"
app-constraints = "python_hooks.app_constraints:main"
pkg-constraints = "python_hooks.pkg_constraints:main"
dockerfile = "python_hooks.dockerfile:main"
skill-lint = "python_hooks.skill_lint:main"

[dependency-groups]
dev = [
    "black==24.3.0",
    "flake8==7.3.0",
    "mypy>=1.1.1",
    "pre-commit>=3.1.1",
    "pytest>=7.2.2",
    "pytest-cov>=4.0.0",
    "pytest-sugar>=0.9.6",
    "pytest-xdist>=3.2.1",
    "types-toml>=0.10.8.6",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# hatch-vcs derives the version from the git tag at build time (replacing
# poetry-dynamic-versioning). fallback-version keeps untagged/isolated builds
# (e.g. pre-commit installing the repo) from erroring when no tag is reachable.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["python_hooks"]

[tool.black]
line-length = 140
skip-string-normalization = true
target_version = ['py310']

[tool.mypy]
files = 'python_hooks'
python_version = '3.10'
check_untyped_defs = false
warn_incomplete_stub = true
follow_imports = 'silent'
ignore_missing_imports = true
mypy_path = 'stubs'
implicit_optional = true
